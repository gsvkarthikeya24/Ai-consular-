services:
  # Backend service
  - type: web
    name: ai-consular-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: ai_consular
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        fromService:
          type: static
          name: ai-consular-frontend
          property: url

  # Frontend — Static Site (Cheaper, faster, and auto-CDNs)
  - type: static
    name: ai-consular-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishDir: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-consular-backend
          property: url
    routes:
      # Handle React Router client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
